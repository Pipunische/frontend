<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 3D Градиент для красного борта фишки -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="40%" stop-color="#c0392b" />
      <stop offset="100%" stop-color="#600000" />
    </linearGradient>

    <!-- Объемный градиент для белой сердцевины (эффект матового пластика) -->
    <radialGradient id="whiteCoreShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d5dbdb"/> <!-- Легкая серая тень по краям -->
    </radialGradient>
  </defs>

  <!-- 1. Мягкая внешняя тень на сукно -->
  <circle cx="33" cy="33" r="29" fill="rgba(0,0,0,0.5)" filter="blur(1px)" />

  <!-- 2. Красный пластиковый борт -->
  <circle cx="32" cy="32" r="29" fill="url(#edgeGrad)" stroke="#111111" stroke-width="1" />

  <!-- 3. Белые сектора казино -->
  <g stroke="#ffffff" stroke-width="4.5" stroke-dasharray="10 14" opacity="0.95">
    <circle cx="32" cy="32" r="25.5" fill="none" />
  </g>

  <!-- 4. Черный разделительный ободок вокруг белого центра -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#111111" stroke-width="1.5" />

  <!-- 5. Белая объемная сердцевина (вместо черной) -->
  <circle cx="32" cy="32" r="19.5" fill="url(#whiteCoreShine)" />

  <!-- 6. Идеальная черная векторная ПИКА (♠) в центре -->
  <path d="M32 20.5 
           C29.2 20.5 25.5 24 25.5 29 
           C25.5 32.5 28 34.5 30.5 34.5 
           C31 34.5 31.3 35 30.7 36 
           L28 42.5 
           L36 42.5 
           L33.3 36 
           C32.7 35 33 34.5 33.5 34.5 
           C36 34.5 38.5 32.5 38.5 29 
           C38.5 24 34.8 20.5 32 20.5 Z" 
        fill="#111111" 
        style="filter: drop-shadow(1px 1px 1.5px rgba(0,0,0,0.2));" />

  <!-- 7. Световой блик глянца сверху -->
  <path d="M 12 21 A 23 23 0 0 1 52 21" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.35" />
</svg>