<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokerClub - Вход</title>
    
    <!-- Подключаем крутой шрифт Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Подключаем иконки FontAwesome (человечек и замок) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Подключаем твой новый Glassmorphism CSS -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/glass_auth.css') }}">
</head>
<body>

    <div class="login-box">
        <!-- ФОРМА: action="/login" и method="POST" говорят браузеру отправить данные Питону! -->
        <form action="/login" method="POST" id="loginForm">
            <h2>ВХОД</h2>

            <!-- Блок для вывода ошибки от Питона (например, "Неверный пароль") -->
            {% if error %}
                <div class="error-msg">{{ error }}</div>
            {% endif %}

            <!-- Поле Логина -->
            <div class="input-group">
                <i class="fas fa-user"></i>
                <!-- name="login" - это то, что ждет Питон: login: str = Form(...) -->
                <input type="text" name="login" id="username" placeholder="Ваш логин" required autocomplete="off">
            </div>

            <!-- Поле Пароля -->
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <!-- name="password" - это то, что ждет Питон: password: str = Form(...) -->
                <input type="password" name="password" id="password" placeholder="Пароль" required>
            </div>

            <button type="submit" class="login-btn" id="submitBtn">Войти в клуб</button>

            <p class="signup-link">
                Новичок? <a href="/register">Создать аккаунт</a>
            </p>
        </form>
    </div>

    <script>
        // Простенький визуал при нажатии кнопки (пока Питон думает)
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', function() {
            submitBtn.innerText = 'ПРОВЕРКА...';
            submitBtn.style.opacity = '0.7';
            // Не делаем e.preventDefault(), чтобы браузер реально отправил POST запрос Питону!
        });
    </script>
</body>
</html>
