<style>
    body {
        /* Сохраняем твой красивый фон с девушками */
        background: url('/static/images/auth_fon.jpg') no-repeat center center fixed; 
        background-size: cover;
        margin: 0;
        color: white; 
        font-family: 'Segoe UI', sans-serif;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* 🔥 Новый полноэкранный дашборд */
    .dashboard-wrapper {
        width: 90%;
        max-width: 1200px;
        height: 80vh;
        background: rgba(30, 40, 50, 0.85); /* Полупрозрачная темная панель */
        backdrop-filter: blur(10px); /* Стеклянный эффект */
        border: 2px solid #3498db;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        display: flex;
        overflow: hidden; /* Чтобы внутренние блоки не вылезали за скругления */
    }

    /* Левая колонка (Аватар и Базовое Инфо) */
    .profile-sidebar {
        width: 350px;
        background: rgba(20, 25, 30, 0.6);
        padding: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        border-right: 1px solid rgba(52, 152, 219, 0.3);
    }

    /* Правая колонка (Статистика и Настройки) */
    .profile-content {
        flex-grow: 1;
        padding: 40px;
        position: relative;
    }

    /* === ЭЛЕМЕНТЫ ЛЕВОЙ КОЛОНКИ === */
    .avatar-preview {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: linear-gradient(135deg, #3498db, #8e44ad);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 60px;
        font-weight: 900;
        color: white;
        border: 4px solid #f1c40f;
        box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        overflow: hidden;
        margin-bottom: 20px;
    }
    .avatar-preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .user-nickname {
        color: #f1c40f;
        font-size: 28px;
        margin: 10px 0;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .wallet-badge {
        background: rgba(46, 204, 113, 0.2);
        border: 1px solid #2ecc71;
        color: #2ecc71;
        padding: 10px 20px;
        border-radius: 20px;
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 30px;
    }

    /* Кнопки */
    .file-upload-btn, .save-btn, .back-btn {
        width: 100%;
        padding: 15px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        text-transform: uppercase;
        text-align: center;
        transition: 0.3s;
        box-sizing: border-box;
        display: inline-block;
        text-decoration: none;
        margin-bottom: 15px;
    }

    .file-upload-btn { background: #34495e; color: white; border: 1px solid #3498db; }
    .file-upload-btn:hover { background: #3498db; }
    .hidden-input { display: none; }
    
    .save-btn { background: #27ae60; color: white; border: none; }
    .save-btn:hover { background: #2ecc71; transform: scale(1.02); }

    .back-btn { background: transparent; border: 2px solid #95a5a6; color: #95a5a6; margin-top: auto; }
    .back-btn:hover { border-color: #f1c40f; color: #f1c40f; }

    /* === ЭЛЕМЕНТЫ ПРАВОЙ КОЛОНКИ (Заготовка) === */
    .content-header {
        font-size: 24px;
        color: #bdc3c7;
        border-bottom: 2px solid #34495e;
        padding-bottom: 10px;
        margin-top: 0;
        margin-bottom: 30px;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .stat-card {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid #34495e;
        padding: 20px;
        border-radius: 15px;
        text-align: center;
    }
    .stat-title { color: #95a5a6; font-size: 14px; text-transform: uppercase; margin-bottom: 10px; }
    .stat-value { color: white; font-size: 28px; font-weight: bold; }

</style>
</head>
<body>

<div class="dashboard-wrapper">
    
    <!-- ЛЕВАЯ КОЛОНКА: Аватар и Баланс -->
    <div class="profile-sidebar">
        <div class="avatar-preview" id="avatar-container">
            {{ user.name[0] | upper }}
        </div>
        
        <h2 class="user-nickname">{{ user.name }}</h2>
        <div class="wallet-badge">💰 {{ user.wallet_balance }} 🪙</div>

        <!-- Форма аватара -->
        <form id="avatar-form" action="/api/upload-avatar" method="POST" enctype="multipart/form-data" style="width: 100%;">
            <label class="file-upload-btn">
                📷 Выбрать фото
                <input type="file" id="avatar-input" name="avatar" accept="image/png, image/jpeg, image/webp" class="hidden-input">
            </label>
            <button type="submit" class="save-btn" id="save-btn" style="display: none;">
                💾 Сохранить аватар
            </button>
        </form>

        <a href="/lobby" class="back-btn">← Вернуться в Лобби</a>
    </div>

    <!-- ПРАВАЯ КОЛОНКА: Заготовка под статистику -->
    <div class="profile-content">
        <h2 class="content-header">Статистика Игрока</h2>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Сыграно раздач</div>
                <div class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Выиграно фишек</div>
                <div class="stat-value" style="color: #2ecc71;">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Самый крупный банк</div>
                <div class="stat-value" style="color: #f1c40f;">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Ранг</div>
                <div class="stat-value" style="color: #9b59b6;">Sucker</div>
            </div>
        </div>
    </div>

</div>

<!-- Тот же самый JS скрипт для превью (он был рабочий) -->
<script>
    const fileInput = document.getElementById('avatar-input');
    const avatarContainer = document.getElementById('avatar-container');
    const saveBtn = document.getElementById('save-btn');

    fileInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            saveBtn.style.display = 'block';
            const reader = new FileReader();
            reader.onload = function(e) {
                avatarContainer.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
            }
            reader.readAsDataURL(file);
        }
    });
</script>
</body>
</html>
