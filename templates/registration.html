<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokerClub - Регистрация</title>
    
    <!-- Тот же крутой шрифт Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Иконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Используем тот же самый CSS-файл! -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/glass_auth.css') }}">
</head>
<body>

    <div class="login-box">
        <!-- ФОРМА: action="/register" шлет данные в твою функцию registration_process -->
        <form action="/register" method="POST" id="regForm">
            <h2>РЕГИСТРАЦИЯ</h2>

            <!-- Ошибки от Владоса или Питона -->
            {% if error %}
                <div class="error-msg">{{ error }}</div>
            {% endif %}

            <!-- Поле Никнейма (nickname) -->
            <div class="input-group">
                <i class="fas fa-id-badge"></i>
                <input type="text" name="nickname" placeholder="Ваш игровой ник" required autocomplete="off">
            </div>

            <!-- Поле Логина (login) -->
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" name="login" placeholder="Придумайте логин" required autocomplete="off">
            </div>

            <!-- Поле Пароля (password) -->
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" placeholder="Придумайте пароль" required>
            </div>

            <button type="submit" class="login-btn" id="submitBtn">Стать игроком</button>

            <p class="signup-link">
                Уже в клубе? <a href="/login">Войти</a>
            </p>
        </form>
    </div>

    <script>
        // Небольшой интерактив при отправке
        const regForm = document.getElementById('regForm');
        const submitBtn = document.getElementById('submitBtn');

        regForm.addEventListener('submit', function() {
            submitBtn.innerText = 'РЕГИСТРАЦИЯ...';
            submitBtn.style.background = '#22c55e'; // Зеленеет при успехе
        });
    </script>
</body>
</html>
